# sample-service: an example program on the Pi that reads its settings from pi-configurator and
# applies changes from the phone while it runs. Its settings are the "Sample Service" group in
# ../../config-template/config.json. Copy this folder as the starting point for your own service.
#
# A separate uv project (not a member of ../../python's workspace), so it depends on
# pi-configurator-client the way any outside program would.

[project]
name = "sample-service"
version = "0.1.0"
description = "Example Pi service that reads and live-applies its settings from pi-configurator"
requires-python = ">=3.12"
# The [dbus] extra hears the service's change signal, so updates apply at once (without it the
# client polls values.json every second).
dependencies = ["pi-configurator-client[dbus]"]

[project.scripts]
sample-service = "sample_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_service"]

[tool.uv.sources]
# In this repo: the client from ../../python/client. Outside it, install it from GitHub:
#   pi-configurator-client @ git+https://github.com/AlexMaghen/pi-configurator#subdirectory=python/client
pi-configurator-client = { path = "../../python/client", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1.390"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
