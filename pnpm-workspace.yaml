# JavaScript/TypeScript workspaces. The Python side lives in python/ as a uv workspace and is
# wired into turbo through python/package.json.
packages:
  - "apps/*"
  - "packages/*"
  - "python"

# Expo/Metro resolves native modules most reliably from a hoisted node_modules.
nodeLinker: hoisted

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
  # Fetches the Bun binary that compiles apps/build-pifig-sd.
  bun: true
