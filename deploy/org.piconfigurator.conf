<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  pi-configurator on the system D-Bus. Installed by deploy/install.sh to
  /etc/dbus-1/system.d/org.piconfigurator.conf.

  The service (root) owns org.piconfigurator and emits org.piconfigurator.Settings1.Changed(as)
  from /org/piconfigurator/settings after each save. Broadcast signals reach every listener under
  the default policy, which is fine: the signal names changed keys only, never values (those stay
  in values.json, readable by the pi-configurator group). Anyone may introspect it with
  busctl (system bus): busctl introspect org.piconfigurator /org/piconfigurator/settings

  No double hyphens in this comment: XML doesn't allow them there, and dbus-daemon then skips
  the whole file.
-->
<busconfig>
  <policy user="root">
    <allow own="org.piconfigurator"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.piconfigurator"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
